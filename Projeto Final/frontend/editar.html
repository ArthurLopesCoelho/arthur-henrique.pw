
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Funcionário</title>
    <link rel="stylesheet" href="cadastro.css">
    <script>
    if (localStorage.getItem('logado') !== 'true') {
        window.location.href = 'login.html';
    }
</script>
</head>
<body>

    <div class="container">
        <h1>Sistema RH</h1>
        <h2>Editar Funcionário</h2>

        <form id="formEditar">

            <label>Nome</label>
            <input type="text" id="nome" required>

            <label>Função</label>
            <input type="text" id="funcao" required>

            <label>Salário</label>
            <input type="number" id="salario" step="0.01" required>

            <label>E-mail</label>
            <input type="email" id="email" required>

            <label>Data de admissão</label>
            <input type="date" id="data_admissao" required>

            <label>Status</label>
            <select id="status">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select>

            <label>ID do departamento</label>
            <input type="number" id="departamento_id" min="1" required>

            <button type="submit">Salvar alterações</button>

            <p id="mensagem"></p>
        </form>

        <button onclick="window.location.href='funcionarios.html'">
            Voltar
        </button>
    </div>

    <script src="editar.js"></script>
</body>
</html>
